name: Build and Deploy Portfolio

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            rahuldan98/rahul-portfolio:${{ github.sha }}
            rahuldan98/rahul-portfolio:latest

      - name: Update Kubernetes image
        run: |
          sed -i "s#rahuldan98/rahul-portfolio:.*#rahuldan98/rahul-portfolio:${{ github.sha }}#" k8s/deployment.yaml

      - name: Commit Kubernetes manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "Update portfolio image to ${{ github.sha }}" || exit 0
          git push
