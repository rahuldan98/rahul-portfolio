worker_processes auto;
pid /tmp/nginx.pid;                       # writable by non-root
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;

  # Temp dirs in /tmp so the container also works with a read-only root filesystem
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # Compression
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_vary on;
  gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (location blocks below use `expires` only, so these are inherited)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:" always;

    # Health endpoint for Docker / Kubernetes probes
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # index.html must always be revalidated so new deploys show up
    location = /index.html { expires -1; }

    # Vite fingerprints files in /assets, so they can be cached for a year
    location /assets/ { expires 1y; try_files $uri =404; }

    location ~* \.(?:svg|ico|png|jpg|jpeg|webp|woff2?)$ { expires 7d; }

    # SPA fallback
    location / { try_files $uri $uri/ /index.html; }
  }
}
