
name: Build and Deploy Portfolio

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'rahul-portfolio-latest/rahul-portfolio/k8s/**'
      - 'README.md'
      - '.github/workflows/**'

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: portfolio-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build and push Docker image
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./rahul-portfolio-latest/rahul-portfolio
          file: ./rahul-portfolio-latest/rahul-portfolio/Dockerfile
          push: true
          tags: |
            rahuldan98/rahul-portfolio-latest:${{ github.sha }}

      # 5. Configure Git identity
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 6. Update the Kubernetes image tag
      - name: Update Kustomize image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s/newTag:.*/newTag: \"${IMAGE_TAG}\"/" \
            rahul-portfolio-latest/rahul-portfolio/k8s/kustomization.yaml

          cat rahul-portfolio-latest/rahul-portfolio/k8s/kustomization.yaml

      # 7. Create a branch and commit the manifest update
      - name: Create deployment branch
        id: deployment
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          BRANCH="automation/deploy-${IMAGE_TAG}"

          git switch -c "$BRANCH"

          git add rahul-portfolio-latest/rahul-portfolio/k8s/kustomization.yaml

          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: deploy portfolio image ${IMAGE_TAG}"

          git push origin "$BRANCH"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # 8. Open a pull request to update the deployment
      - name: Create deployment pull request
        if: steps.deployment.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
          BRANCH: ${{ steps.deployment.outputs.branch }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Deploy portfolio image ${IMAGE_TAG}" \
            --body "Automated Kubernetes image-tag update.

          Docker image:
          rahuldan98/rahul-portfolio-latest:${IMAGE_TAG}

          Please review and merge this PR to deploy through Argo CD."
