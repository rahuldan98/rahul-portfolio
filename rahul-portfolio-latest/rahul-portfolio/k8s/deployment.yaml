apiVersion: apps/v1
kind: Deployment
metadata:
  name: rahul-portfolio
  labels: { app: rahul-portfolio }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # never drop below 2 ready pods during a rollout
  selector:
    matchLabels: { app: rahul-portfolio }
  template:
    metadata:
      labels: { app: rahul-portfolio }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101           # "nginx" user in nginx:alpine (remove on OpenShift)
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: rahuldan98/rahul-portfolio-latest:v1   # TODO: set your Docker Hub user
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: 50m,  memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }   # nginx pid + temp files
      volumes:
        - name: tmp
          emptyDir: {}
