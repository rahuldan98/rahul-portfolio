apiVersion: apps/v1
kind: Deployment
metadata:
  name: rahul-portfolio
spec:
  replicas: 2

  selector:
    matchLabels:
      app: rahul-portfolio

  template:
    metadata:
      labels:
        app: rahul-portfolio

    spec:

      containers:

        - name: website

          image: rahuldan98/rahul-portfolio:9692dca62935ee79ae7e1e9e7d20d20ec5e9a75f

          ports:

            - containerPort: 80

          resources:

            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 200m
              memory: 128Mi


---

apiVersion: v1

kind: Service

metadata:
  name: rahul-portfolio

spec:

  selector:
    app: rahul-portfolio

  ports:

    - port: 80
      targetPort: 80

  type: NodePort
